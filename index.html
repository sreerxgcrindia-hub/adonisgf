<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Ayshu 🌷</title>
    <style>
        :root {
            --bg-color: #030305;
            --pink-light: #ff8fa3;
            --pink-glow: #ff4d6d;
            --purple-glow: #c77dff;
            --yellow-glow: #ffb703;
            --stem-green: #2d6a4f;
            --leaf-green: #40916c;
            --text-color: rgba(255, 255, 255, 0.85);
            --text-subtle: rgba(255, 255, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        /* --- Click to Start Overlay --- */
        #startOverlay {
            position: absolute;
            z-index: 100;
            color: var(--text-subtle);
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: opacity 1.2s ease;
            user-select: none;
        }

        /* --- Romantic Message Styling --- */
        .quote-text {
            color: var(--text-color);
            font-size: 1.05rem;
            font-style: italic;
            font-weight: 300;
            text-align: center;
            max-width: 500px;
            letter-spacing: 0.5px;
            line-height: 1.6;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 2s ease 1s;
            text-shadow: 0 0 12px rgba(255, 143, 163, 0.3);
            margin-bottom: 10px;
        }

        .dedication-text {
            color: var(--pink-light);
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: lowercase;
            text-align: center;
            opacity: 0;
            transform: translateY(10px);
            transition: all 2s ease 2.5s;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.4);
            margin-top: 15px;
        }

        /* --- Floating Glow Petals --- */
        .petal {
            position: absolute;
            background-color: var(--pink-light);
            border-radius: 12px 0px 12px 0px;
            opacity: 0.4;
            pointer-events: none;
            box-shadow: 0 0 8px var(--pink-glow);
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 0.6; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }

        /* --- Bouquet Container --- */
        .bouquet-container {
            width: 300px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            filter: drop-shadow(0 0 25px rgba(255, 77, 109, 0.25));
            transition: filter 1s ease;
        }

        .bouquet-container:hover {
            filter: drop-shadow(0 0 35px rgba(255, 77, 109, 0.45));
        }

        /* --- SVG Animations --- */
        .stem {
            stroke-dasharray: 250;
            stroke-dashoffset: 250;
            transition: stroke-dashoffset 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .leaf {
            opacity: 0;
            transform: scale(0);
            transform-origin: bottom center;
            transition: all 1.8s ease-in-out 1.2s;
        }

        .flower-head {
            opacity: 0;
            transform: scale(0);
            transform-origin: center center;
            transition: all 1.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 2s;
        }

        .ribbon {
            opacity: 0;
            transform: scale(0);
            transform-origin: center center;
            transition: all 1.2s ease 3s;
        }

        /* Grown States triggered on click */
        .grown .stem { stroke-dashoffset: 0; }
        .grown .leaf { opacity: 1; transform: scale(1); }
        .grown .flower-head { opacity: 1; transform: scale(1); }
        .grown .ribbon { opacity: 1; transform: scale(1); }
        
        .grown-text {
            opacity: 1 !important;
            transform: translateY(0) !important;
        }
    </style>
</head>
<body onclick="growBouquet()">

    <div id="startOverlay">Click anywhere</div>

    <!-- Top Thought -->
    <div class="quote-text" id="quoteText">
        "I think I'll miss you forever, like the stars miss the sun in the morning sky"
    </div>

    <!-- Audio Element for Ed Sheeran's 'Perfect' -->
    <audio id="bgMusic" loop>
        <source src="perfect.mp3" type="audio/mpeg">
    </audio>

    <!-- Tulip Bouquet SVG -->
    <div class="bouquet-container" id="bouquet">
        <svg width="300" height="380" viewBox="0 0 320 420">
            <!-- Stems tied together at bottom -->
            <g class="stems">
                <path class="stem" d="M160 380 L110 150" stroke="var(--stem-green)" stroke-width="5" stroke-linecap="round"/>
                <path class="stem" d="M160 380 L135 120" stroke="var(--stem-green)" stroke-width="5" stroke-linecap="round"/>
                <path class="stem" d="M160 380 L160 100" stroke="var(--stem-green)" stroke-width="6" stroke-linecap="round"/>
                <path class="stem" d="M160 380 L185 120" stroke="var(--stem-green)" stroke-width="5" stroke-linecap="round"/>
                <path class="stem" d="M160 380 L210 150" stroke="var(--stem-green)" stroke-width="5" stroke-linecap="round"/>
            </g>

            <!-- Bouquet Leaves -->
            <g class="leaves">
                <path class="leaf" d="M160 300 Q90 260 70 180 Q120 220 160 280" fill="var(--leaf-green)"/>
                <path class="leaf" d="M160 300 Q230 260 250 180 Q200 220 160 280" fill="var(--leaf-green)"/>
                <path class="leaf" d="M160 320 Q110 280 100 220 Q135 240 160 290" fill="var(--stem-green)"/>
                <path class="leaf" d="M160 320 Q210 280 220 220 Q185 240 160 290" fill="var(--stem-green)"/>
            </g>

            <!-- Tulip Heads (Bouquet Arrangement) -->
            <!-- Left Outer Tulip -->
            <g class="flower-head">
                <path d="M85 150 Q85 185 110 190 Q135 185 135 150 Q122 168 110 145 Q98 168 85 150 Z" fill="var(--pink-glow)"/>
                <path d="M98 150 Q110 180 122 150 Q110 135 98 150 Z" fill="var(--pink-light)"/>
            </g>

            <!-- Left Inner Tulip -->
            <g class="flower-head">
                <path d="M110 120 Q110 155 135 160 Q160 155 160 120 Q147 138 135 115 Q123 138 110 120 Z" fill="var(--purple-glow)"/>
                <path d="M123 120 Q135 150 147 120 Q135 105 123 120 Z" fill="#e0aaff"/>
            </g>

            <!-- Center Top Tulip -->
            <g class="flower-head">
                <path d="M132 100 Q132 140 160 145 Q188 140 188 100 Q174 120 160 95 Q146 120 132 100 Z" fill="var(--pink-glow)"/>
                <path d="M146 100 Q160 135 174 100 Q160 85 146 100 Z" fill="var(--pink-light)"/>
            </g>

            <!-- Right Inner Tulip -->
            <g class="flower-head">
                <path d="M160 120 Q160 155 185 160 Q210 155 210 120 Q197 138 185 115 Q173 138 160 120 Z" fill="var(--yellow-glow)"/>
                <path d="M173 120 Q185 150 197 120 Q185 105 173 120 Z" fill="#ffea00"/>
            </g>

            <!-- Right Outer Tulip -->
            <g class="flower-head">
                <path d="M185 150 Q185 185 210 190 Q235 185 235 150 Q222 168 210 145 Q198 168 185 150 Z" fill="var(--pink-glow)"/>
                <path d="M198 150 Q210 180 222 150 Q210 135 198 150 Z" fill="var(--pink-light)"/>
            </g>

            <!-- Bouquet Ribbon -->
            <g class="ribbon">
                <path d="M140 310 C150 305, 170 305, 180 310 C185 320, 135 320, 140 310 Z" fill="#ffffff"/>
                <path d="M150 315 Q135 350 125 365 Q140 345 155 318" fill="#ffffff" opacity="0.8"/>
                <path d="M170 315 Q185 350 195 365 Q180 345 165 318" fill="#ffffff" opacity="0.8"/>
            </g>
        </svg>
    </div>

    <!-- Bottom Dedication -->
    <div class="dedication-text" id="dedicationText">
        everything for u ayshu ✨
    </div>

    <script>
        const audio = document.getElementById("bgMusic");
        let started = false;

        function growBouquet() {
            if (!started) {
                // Fade out text overlay
                const overlay = document.getElementById("startOverlay");
                overlay.style.opacity = "0";

                // Play song
                audio.play().catch(e => console.log("Audio play blocked:", e));

                // Animate bouquet and text fading in smoothly
                document.getElementById("bouquet").classList.add("grown");
                document.getElementById("quoteText").classList.add("grown-text");
                document.getElementById("dedicationText").classList.add("grown-text");

                started = true;
            }
        }

        // Falling Glow Petals
        function createPetal() {
            const petal = document.createElement('div');
            petal.classList.add('petal');
            
            const size = Math.random() * 8 + 6;
            petal.style.width = `${size}px`;
            petal.style.height = `${size + 4}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.animationDuration = `${Math.random() * 3 + 5}s`;
            
            document.body.appendChild(petal);
            setTimeout(() => { petal.remove(); }, 8000);
        }
        setInterval(createPetal, 450);
    </script>
</body>
</html>
